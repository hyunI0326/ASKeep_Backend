spring.application.name=ASKeep
ai.server.base-url=${AI_SERVER_BASE_URL:http://localhost:8000}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/askeep}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
askeep.upload-dir=${UPLOAD_DIR:ai-server/uploads}
askeep.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://askeep.vercel.app}
# Local development fallback only; set JWT_SECRET to a unique secret of at least 32 bytes outside local development.
askeep.jwt.secret=${JWT_SECRET:local-only-secret-change-before-deploy-ASKeep-2026}
askeep.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# 비밀번호 재설정 메일(SMTP). MAIL_HOST가 비어 있으면 메일 대신 서버 로그에 인증코드를 출력한다.
askeep.mail.host=${MAIL_HOST:}
askeep.mail.port=${MAIL_PORT:587}
askeep.mail.username=${MAIL_USERNAME:}
askeep.mail.password=${MAIL_PASSWORD:}
askeep.mail.from=${MAIL_FROM:}
