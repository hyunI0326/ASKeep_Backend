spring.application.name=ASKeep
ai.server.base-url=http://localhost:8000
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/askeep}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
askeep.upload-dir=${UPLOAD_DIR:ai-server/uploads}
askeep.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
# Local development fallback only; set JWT_SECRET to a unique secret of at least 32 bytes outside local development.
askeep.jwt.secret=${JWT_SECRET:local-only-secret-change-before-deploy-ASKeep-2026}
askeep.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
